name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/api-deploy.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ShopEase.Api/ShopEase.Api.csproj

      - name: Build
        run: dotnet build Backend/ShopEase.Api/ShopEase.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Backend/tests/ShopEase.Api.Tests/ShopEase.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ShopEase/Backend/tests/ShopEase.Api.Tests/TestResults/test-results.trx
